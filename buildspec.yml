version: 0.2

env:
  variables:
    STACK_NAME: worldcup-site

phases:
  build:
    commands:
      # a stack stuck in ROLLBACK_COMPLETE (failed first create) can only be deleted
      - export STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
      - |
        if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
          echo "Deleting stack in ROLLBACK_COMPLETE before redeploying"
          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
        fi

      # deploy/update infrastructure
      - aws cloudformation deploy
          --template-file infra/template.yml
          --stack-name "$STACK_NAME"
          --capabilities CAPABILITY_NAMED_IAM
          --no-fail-on-empty-changeset

      # read stack outputs
      - export BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
      - export DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
      - export FETCH_FN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FetchFunctionName'].OutputValue" --output text)

      # publish the static site (data.json is served from DynamoDB via CloudFront, not S3)
      - aws s3 cp index.html "s3://$BUCKET/index.html" --cache-control "public, max-age=300" --content-type "text/html; charset=utf-8"
      - aws s3 cp style.css  "s3://$BUCKET/style.css"  --cache-control "public, max-age=300" --content-type "text/css; charset=utf-8"
      - aws s3 cp app.js     "s3://$BUCKET/app.js"     --cache-control "public, max-age=300" --content-type "text/javascript; charset=utf-8"

      # prime the matches table so /data.json has data immediately
      - aws lambda invoke --function-name "$FETCH_FN" --cli-read-timeout 60 /tmp/fetch-out.json && cat /tmp/fetch-out.json

  post_build:
    commands:
      # skip when the build phase failed before resolving outputs
      - |
        if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
        else
          echo "No distribution id resolved — skipping invalidation"
        fi
