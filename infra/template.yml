AWSTemplateFormatVersion: "2010-09-09"
Description: >
  worldcup.claytondavis.dev — static site (S3 + CloudFront). World Cup 2026
  results are polled from football-data.org every 5 minutes by a Lambda that
  writes data.json into the site bucket. Polling stops automatically after the
  tournament ends.

Parameters:
  DomainName:
    Type: String
    Default: worldcup.claytondavis.dev
  CertificateArn:
    Type: String
    Description: >-
      ACM certificate ARN for the domain. CloudFront requires the certificate
      to be issued in us-east-1 — a cert in any other region will fail.
    Default: "arn:aws:acm:us-east-1:786401693062:certificate/1071401f-a64b-4ad6-80ad-e29d9d64ad11"
  ApiKeyParameterName:
    Type: String
    Description: SSM parameter holding the football-data.org API key.
    Default: FOOTBALL_DATA_ORG_API_KEY
  OddsApiKeyParameterName:
    Type: String
    Description: SSM parameter holding The-Odds-API key (free tier, 500 req/month).
    Default: THE-ODDS-API-KEY

  TournamentEndDate:
    Type: String
    Description: >-
      After this UTC timestamp the schedule stops firing (EventBridge Scheduler
      EndDate) and the Lambda refuses to call the API even if invoked manually.
      Final is 2026-07-19; default leaves a buffer for post-final corrections.
    Default: "2026-07-22T00:00:00.000Z"

Resources:
  # ---------------- static site ----------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------- poller: football-data.org -> s3://site/data.json ----------------
  FetchFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fetch-scores
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SiteBucket.Arn}/data.json"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApiKeyParameterName}"

  FetchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fetch-scores"
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt FetchFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          API_KEY_PARAM: !Ref ApiKeyParameterName
          STOP_AFTER: !Ref TournamentEndDate
      Code:
        ZipFile: |
          const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");
          const { SSMClient, GetParameterCommand } = require("@aws-sdk/client-ssm");
          const s3 = new S3Client();
          const ssm = new SSMClient();
          let apiKey;
          exports.handler = async () => {
            if (Date.now() > Date.parse(process.env.STOP_AFTER)) {
              console.log("tournament over (STOP_AFTER passed) — skipping API call");
              return { skipped: true };
            }
            apiKey ||= (await ssm.send(new GetParameterCommand({
              Name: process.env.API_KEY_PARAM, WithDecryption: true }))).Parameter.Value;
            const res = await fetch("https://api.football-data.org/v4/competitions/WC/matches?season=2026",
              { headers: { "X-Auth-Token": apiKey } });
            if (!res.ok) throw new Error("football-data.org HTTP " + res.status);
            const data = await res.json();
            if (!Array.isArray(data.matches) || !data.matches.length) throw new Error("no matches in response");
            data.fetchedAt = new Date().toISOString();
            await s3.send(new PutObjectCommand({
              Bucket: process.env.BUCKET,
              Key: "data.json",
              Body: JSON.stringify(data),
              ContentType: "application/json",
              CacheControl: "public, max-age=60",
            }));
            console.log("wrote data.json with", data.matches.length, "matches");
            return { count: data.matches.length };
          };

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-fetch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FetchFunction.Arn

  FetchSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-fetch-every-5min"
      ScheduleExpression: rate(5 minutes)
      EndDate: !Ref TournamentEndDate
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt FetchFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 1

  # ---------------- odds: the-odds-api.com -> s3://site/odds.json ----------------
  # Strategy (free tier ~500 req/month):
  #   1. Opening: once per matchday, first run when today's matches aren't in the store
  #   2. Closing: any match kicking off in next 15 min → 1 request locks all simultaneous games
  #   3. Backfill: up to 2 historical days per run for finished matches with no odds
  # Estimated usage: ~110 requests for the full tournament.

  OddsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: odds-rw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SiteBucket.Arn}/data.json"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SiteBucket.Arn}/odds.json"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${OddsApiKeyParameterName}"

  OddsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fetch-odds"
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt OddsFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          ODDS_KEY_PARAM: !Ref OddsApiKeyParameterName
          ODDS_SPORT: soccer_fifa_world_cup
          STOP_AFTER: !Ref TournamentEndDate
      Code:
        ZipFile: |
          const {S3Client,PutObjectCommand,GetObjectCommand} = require("@aws-sdk/client-s3");
          const {SSMClient,GetParameterCommand} = require("@aws-sdk/client-ssm");
          const s3 = new S3Client(), ssm = new SSMClient();
          let apiKey;
          const A = {"Czech Republic":"Czechia","Cote d'Ivoire":"Ivory Coast","Côte d'Ivoire":"Ivory Coast","Bosnia and Herzegovina":"Bosnia & Herzegovina","Turkey":"Türkiye","United States":"USA","Congo, DR":"DR Congo","Democratic Republic of Congo":"DR Congo"};
          const norm = n => A[n] || n;
          const rs = async k => { try { const r = await s3.send(new GetObjectCommand({Bucket:process.env.BUCKET,Key:k})); return JSON.parse(await r.Body.transformToString()); } catch { return null; } };
          const gk = async () => { if (!apiKey) apiKey = (await ssm.send(new GetParameterCommand({Name:process.env.ODDS_KEY_PARAM,WithDecryption:true}))).Parameter.Value; return apiKey; };
          const fm = (ev,ms) => ms.find(m => m.homeTeam?.name && Math.abs(new Date(ev.commence_time)-new Date(m.utcDate))<3600e3 && (norm(ev.home_team)===norm(m.homeTeam.name)||norm(ev.away_team)===norm(m.awayTeam.name)));
          const ex = (ev,m) => { const bk=ev.bookmakers?.find(b=>b.key==="pinnacle")||ev.bookmakers?.[0]; const h=bk?.markets?.find(x=>x.key==="h2h"); if(!h)return null; const o={bk:bk.title,t:new Date().toISOString()}; for(const x of h.outcomes) if(norm(x.name)===norm(m.homeTeam.name))o.home=x.price; else if(norm(x.name)===norm(m.awayTeam.name))o.away=x.price; else o.draw=x.price; return(o.home!=null&&o.away!=null)?o:null; };
          const af = async u => { const r=await fetch(u); if(!r.ok){console.error("odds",r.status);return null;} return r.json(); };
          exports.handler = async () => {
            if (Date.now()>Date.parse(process.env.STOP_AFTER)) return {skipped:true};
            const [data,stored] = await Promise.all([rs("data.json"),rs("odds.json")]);
            if (!data?.matches?.length) return {error:"no data"};
            const ms=data.matches, now=Date.now();
            const od=stored||{matches:{},fetchedDates:[]};
            const today=new Date().toISOString().slice(0,10);
            const sp=process.env.ODDS_SPORT||"soccer_fifa_world_cup";
            const base="https://api.the-odds-api.com/v4";
            let dirty=false;
            const cIds=new Set(ms.filter(m=>{const k=new Date(m.utcDate).getTime();return k-now>0&&k-now<15*60e3&&!od.matches[m.id]?.closing;}).map(m=>String(m.id)));
            const needOpen=!od.fetchedDates.includes(today)&&ms.some(m=>m.utcDate.startsWith(today));
            if (cIds.size||needOpen) {
              const evs=await af(`${base}/sports/${sp}/odds/?apiKey=${await gk()}&regions=us,uk&markets=h2h&oddsFormat=american`);
              if (evs) { dirty=true; for(const ev of evs){const m=fm(ev,ms);if(!m)continue;const o=ex(ev,m);if(!o)continue;if(cIds.has(String(m.id)))o.closing=true;else o.opening=true;od.matches[m.id]=o;} if(needOpen)od.fetchedDates.push(today); }
            }
            const md=[...new Set(ms.filter(m=>m.status==="FINISHED"&&!od.matches[m.id]).map(m=>m.utcDate.slice(0,10)))].filter(d=>!od.fetchedDates.includes(d)).slice(0,2);
            for(const d of md){
              const h=await af(`${base}/historical/sports/${sp}/odds/?apiKey=${await gk()}&date=${d}T18:00:00Z&regions=us,uk&markets=h2h&oddsFormat=american`);
              if(h?.data){dirty=true;for(const ev of h.data){const m=fm(ev,ms);if(m&&!od.matches[m.id]){const o=ex(ev,m);if(o){o.closing=true;od.matches[m.id]=o;}}}od.fetchedDates.push(d);}
            }
            if(dirty){od.updatedAt=new Date().toISOString();await s3.send(new PutObjectCommand({Bucket:process.env.BUCKET,Key:"odds.json",Body:JSON.stringify(od),ContentType:"application/json",CacheControl:"public, max-age=60"}));}
            console.log(`odds:${Object.keys(od.matches).length} dirty=${dirty}`);
            return{count:Object.keys(od.matches).length,dirty};
          };

  OddsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-odds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt OddsFunction.Arn

  OddsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-fetch-odds-every-5min"
      ScheduleExpression: rate(5 minutes)
      EndDate: !Ref TournamentEndDate
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt OddsFunction.Arn
        RoleArn: !GetAtt OddsSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

  # ---------------- CloudFront ----------------
  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-data-60s"
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed CachingOptimized policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: data.json
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref DataCachePolicy
            AllowedMethods: [GET, HEAD]

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point worldcup.claytondavis.dev at this (CNAME / Route53 alias).
    Value: !GetAtt Distribution.DomainName
  FetchFunctionName:
    Value: !Ref FetchFunction
  OddsFunctionName:
    Value: !Ref OddsFunction
